name: Check publisher

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.24"
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # uv's download index skips some patch releases, so the runner takes any 3.14.
      - run: uv python install 3.14
      - run: echo "UV_PYTHON=3.14" >> "$GITHUB_ENV"
      - run: uv sync --locked --extra dev
      - run: npm install --global npm@12.2.0
      - run: npm ci
      - run: npm --prefix tools/ghost-theme ci
      # Chromium system libraries (Playwright calls sudo); make prepare-checks then
      # fetches Chrome for Testing and pulls the pinned Ghost and Caddy images.
      - run: tools/ghost-theme/node_modules/.bin/playwright install-deps chromium
      - run: make prepare-checks
      - run: make check
        env:
          UV_OFFLINE: "1"
      - run: make image-check IMAGE=wtf-adsb-publisher:check
